<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
    <style>
        :root { color-scheme: light dark; --bg: #f7f7f5; --text: #1b1b19; --muted: #6c6c66; --accent: #0b7fab; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f1013; --text: #ececf1; --muted: #8e8f9a; --accent: #61dafb; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { margin: 0; color: var(--muted); }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>This page doesn't exist. <a href="/">Back to all projects</a></p>
    </main>
</body>
</html>
